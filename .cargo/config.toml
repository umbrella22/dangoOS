# The host remains Cargo's default target. Firmware aliases select the MCU explicitly.
[alias]
# Firmware build: cargo fw  (flash + monitor: cargo fw-run, needs a board)
fw = "build -p os --bin os-fw --features firmware --release --target riscv32imafc-unknown-none-elf"
fw-run = "run -p os --bin os-fw --features firmware --release --target riscv32imafc-unknown-none-elf"

[target.riscv32imafc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32s31"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[env]
ESP_LOG = "info"
# esp-alloc: TLSF instead of the default linked-list first fit. First fit walks
# the free list (in PSRAM) on every allocation; the Lua heap makes thousands of
# small allocations, and TLSF keeps each one O(1).
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = "TLSF"
# The paths below are the author's machine. Cargo does not override variables
# that are already set, so other machines export their own (see README,
# "Build environment").
# os: LVGL 9.6 的 C 源码需要真正的 riscv32 C 编译器（Apple clang 无
# riscv32 target）。Espressif 的 riscv32-esp-elf 工具链装在 ~/esp-tools/，
# bindgen 的 libclang 使用下面指定的 Xcode 工具链。
CC_riscv32imafc_unknown_none_elf = "/Users/ikaros/esp-tools/riscv32-esp-elf/bin/riscv32-esp-elf-gcc"
CFLAGS_riscv32imafc_unknown_none_elf = "-march=rv32imafc -mabi=ilp32f -ffreestanding"
# 静态库归档也用 esp 工具链的 ar（宿主 Apple ar 对 riscv ELF 成员的处理不可靠）。
AR_riscv32imafc_unknown_none_elf = "/Users/ikaros/esp-tools/riscv32-esp-elf/bin/riscv32-esp-elf-ar"
# bindgen 的 libclang 必须用 Xcode 自带的（Homebrew LLVM 的 libclang 解析
# LVGL 9.6 头文件时会把 lv_anim_t 等结构体错误地产出为不透明类型，而 Apple
# libclang 完整且同样支持 riscv32 target 的解析）。
LIBCLANG_PATH = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib"
# 只对 RISC-V 绑定加入 newlib 头文件。rs_lvgl 的构建依赖也会在主机
# 编译，不能用全局 LVGL_SYSROOT 把 newlib 与主机 libc 头文件混用。
BINDGEN_EXTRA_CLANG_ARGS_riscv32imafc_unknown_none_elf = "-I/Users/ikaros/esp-tools/riscv32-esp-elf/riscv32-esp-elf/include"
