name: Firmware

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package ESP32-S31
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libclang-18-dev pkg-config
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --target riscv32imafc-unknown-none-elf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: firmware-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'scripts/release/inputs.json') }}
          restore-keys: firmware-${{ runner.os }}-
      - name: Install pinned Espressif tools
        run: python3 scripts/release/bootstrap.py --out "$RUNNER_TEMP/dango-tools"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Use commit time for firmware metadata
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Test workspace and build firmware
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Build OTA and full-install packages with NAND skins
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          package_dir="$RUNNER_TEMP/firmware-release"
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            python3 scripts/release/package.py build --out "$package_dir" --tag "$RELEASE_REF_NAME"
          else
            python3 scripts/release/package.py build --out "$package_dir"
          fi
          python3 scripts/release/package.py verify "$package_dir"
      - name: Save release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-release
          path: ${{ runner.temp }}/firmware-release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-build-evidence
          path: |
            ${{ runner.temp }}/checks.log
            target/riscv32imafc-unknown-none-elf/release/os-fw
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish verified tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-release
          path: release-assets
      - name: Verify, upload, download and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/publish.py release-assets --repo "$RELEASE_REPOSITORY"
