<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- EVE 风格渐变 -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1821;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#071119;stop-opacity:0.85" />
    </linearGradient>
    
    <!-- 扫描线动画 -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5fd0e0;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#5fd0e0;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#5fd0e0;stop-opacity:0" />
    </linearGradient>
    
    <!-- 辉光滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="480" height="480" fill="#02060a"/>
  
  <!-- 星空背景点缀 -->
  <circle cx="50" cy="50" r="1" fill="#5fd0e0" opacity="0.3"/>
  <circle cx="420" cy="80" r="1.5" fill="#5fd0e0" opacity="0.4"/>
  <circle cx="100" cy="400" r="1" fill="#e8c25a" opacity="0.3"/>
  <circle cx="350" cy="420" r="1.5" fill="#6fb7ff" opacity="0.2"/>
  
  <!-- 扫描线 -->
  <rect x="0" y="120" width="480" height="2" fill="url(#scanline)" opacity="0.6">
    <animate attributeName="y" from="-100" to="580" dur="5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 标题栏 -->
  <g id="header">
    <text x="20" y="30" font-family="Rajdhani, sans-serif" font-size="16" font-weight="700" fill="#5fd0e0">
      THERMAL CONTROL SYSTEM
    </text>
    <text x="20" y="48" font-family="Share Tech Mono, monospace" font-size="11" fill="#68838f">
      ESP-MOSAICO · S31 · V0.2.0
    </text>
  </g>
  
  <!-- 顶部状态栏 -->
  <g id="status-bar">
    <!-- 面板背景 -->
    <rect x="10" y="65" width="460" height="50" fill="url(#panelGrad)" stroke="#6ebdd266" stroke-width="1"/>
    
    <!-- 左上角标 -->
    <line x1="9" y1="65" x2="23" y2="65" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="64" x2="10" y2="78" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 右上角标 -->
    <line x1="457" y1="65" x2="471" y2="65" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="64" x2="470" y2="78" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 左下角标 -->
    <line x1="9" y1="115" x2="23" y2="115" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="102" x2="10" y2="116" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 右下角标 -->
    <line x1="457" y1="115" x2="471" y2="115" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="102" x2="470" y2="116" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 状态内容 -->
    <text x="25" y="85" font-family="Rajdhani, sans-serif" font-size="12" font-weight="600" fill="#5fd0e0">
      SYSTEM STATUS
    </text>
    
    <!-- 运行时间 -->
    <text x="25" y="105" font-family="Share Tech Mono, monospace" font-size="11" fill="#c2dbe4">
      UPTIME: 00:23:41
    </text>
    
    <!-- CPU温度 -->
    <text x="200" y="105" font-family="Share Tech Mono, monospace" font-size="11" fill="#c2dbe4">
      CPU: 42°C
    </text>
    
    <!-- 状态指示 -->
    <circle cx="440" cy="90" r="4" fill="#7bc98a" filter="url(#glow)"/>
    <text x="380" y="95" font-family="Rajdhani, sans-serif" font-size="11" fill="#7bc98a">
      [ ONLINE ]
    </text>
  </g>
  
  <!-- 左侧温度面板 -->
  <g id="temp-panel">
    <!-- 面板背景 -->
    <rect x="10" y="130" width="220" height="160" fill="url(#panelGrad)" stroke="#6ebdd266" stroke-width="1"/>
    
    <!-- 四角标记 -->
    <line x1="9" y1="130" x2="23" y2="130" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="129" x2="10" y2="143" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="217" y1="130" x2="231" y2="130" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="230" y1="129" x2="230" y2="143" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="9" y1="290" x2="23" y2="290" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="277" x2="10" y2="291" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="217" y1="290" x2="231" y2="290" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="230" y1="277" x2="230" y2="291" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 标题 -->
    <text x="25" y="150" font-family="Rajdhani, sans-serif" font-size="13" font-weight="600" fill="#5fd0e0">
      THERMAL MONITOR
    </text>
    
    <!-- 分隔线 -->
    <line x1="25" y1="158" x2="215" y2="158" stroke="#6ebdd222" stroke-width="1"/>
    
    <!-- 温度读数 -->
    <text x="25" y="185" font-family="Share Tech Mono, monospace" font-size="10" fill="#68838f">
      SENSOR-01
    </text>
    <text x="25" y="202" font-family="Rajdhani, sans-serif" font-size="32" font-weight="700" fill="#5fd0e0">
      28.5
    </text>
    <text x="90" y="202" font-family="Rajdhani, sans-serif" font-size="18" fill="#7895a1">
      °C
    </text>
    
    <!-- 温度条形图 -->
    <rect x="25" y="220" width="190" height="8" fill="#1a2029" rx="1"/>
    <rect x="25" y="220" width="95" height="8" fill="#5fd0e0" rx="1">
      <animate attributeName="width" values="95;98;95" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 阈值标记 -->
    <text x="25" y="245" font-family="Share Tech Mono, monospace" font-size="9" fill="#68838f">
      NOMINAL
    </text>
    <text x="130" y="245" font-family="Share Tech Mono, monospace" font-size="9" fill="#e8c25a">
      WARNING: 60°C
    </text>
    
    <!-- 趋势指示 -->
    <text x="25" y="265" font-family="Share Tech Mono, monospace" font-size="9" fill="#7bc98a">
      ▲ +0.2°C/min
    </text>
  </g>
  
  <!-- 右侧转速面板 -->
  <g id="rpm-panel">
    <!-- 面板背景 -->
    <rect x="250" y="130" width="220" height="160" fill="url(#panelGrad)" stroke="#6ebdd266" stroke-width="1"/>
    
    <!-- 四角标记 -->
    <line x1="249" y1="130" x2="263" y2="130" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="250" y1="129" x2="250" y2="143" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="457" y1="130" x2="471" y2="130" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="129" x2="470" y2="143" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="249" y1="290" x2="263" y2="290" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="250" y1="277" x2="250" y2="291" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="457" y1="290" x2="471" y2="290" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="277" x2="470" y2="291" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 标题 -->
    <text x="265" y="150" font-family="Rajdhani, sans-serif" font-size="13" font-weight="600" fill="#5fd0e0">
      ROTATION SPEED
    </text>
    
    <!-- 分隔线 -->
    <line x1="265" y1="158" x2="455" y2="158" stroke="#6ebdd222" stroke-width="1"/>
    
    <!-- 转速读数 -->
    <text x="265" y="185" font-family="Share Tech Mono, monospace" font-size="10" fill="#68838f">
      FAN-01
    </text>
    <text x="265" y="205" font-family="Rajdhani, sans-serif" font-size="28" font-weight="700" fill="#e8c25a">
      2450
    </text>
    <text x="345" y="205" font-family="Rajdhani, sans-serif" font-size="16" fill="#7895a1">
      RPM
    </text>
    
    <!-- 转速百分比环形 -->
    <circle cx="420" cy="195" r="25" fill="none" stroke="#1a2029" stroke-width="4"/>
    <circle cx="420" cy="195" r="25" fill="none" stroke="#e8c25a" stroke-width="4" 
            stroke-dasharray="110" stroke-dashoffset="27.5"
            transform="rotate(-90 420 195)" filter="url(#glow)"/>
    <text x="420" y="200" font-family="Rajdhani, sans-serif" font-size="16" font-weight="700" fill="#e8c25a" text-anchor="middle">
      75
    </text>
    <text x="420" y="212" font-family="Share Tech Mono, monospace" font-size="8" fill="#68838f" text-anchor="middle">
      %
    </text>
    
    <!-- 功率 -->
    <text x="265" y="245" font-family="Share Tech Mono, monospace" font-size="9" fill="#68838f">
      POWER: 5.2W
    </text>
    
    <!-- 效率 -->
    <text x="365" y="245" font-family="Share Tech Mono, monospace" font-size="9" fill="#7bc98a">
      EFFICIENCY: OPTIMAL
    </text>
  </g>
  
  <!-- 底部控制面板 -->
  <g id="control-panel">
    <!-- 面板背景 -->
    <rect x="10" y="310" width="460" height="120" fill="url(#panelGrad)" stroke="#6ebdd266" stroke-width="1"/>
    
    <!-- 四角标记 -->
    <line x1="9" y1="310" x2="23" y2="310" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="309" x2="10" y2="323" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="457" y1="310" x2="471" y2="310" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="309" x2="470" y2="323" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="9" y1="430" x2="23" y2="430" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="10" y1="417" x2="10" y2="431" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="457" y1="430" x2="471" y2="430" stroke="#6ebdd26e" stroke-width="1"/>
    <line x1="470" y1="417" x2="470" y2="431" stroke="#6ebdd26e" stroke-width="1"/>
    
    <!-- 标题 -->
    <text x="25" y="330" font-family="Rajdhani, sans-serif" font-size="13" font-weight="600" fill="#5fd0e0">
      FAN CONTROL
    </text>
    
    <!-- 分隔线 -->
    <line x1="25" y1="338" x2="455" y2="338" stroke="#6ebdd222" stroke-width="1"/>
    
    <!-- 速度档位标签 -->
    <text x="25" y="360" font-family="Share Tech Mono, monospace" font-size="10" fill="#68838f">
      SPEED LEVEL
    </text>
    
    <!-- 滑杆轨道 -->
    <rect x="25" y="370" width="430" height="12" fill="#1a2029" rx="6"/>
    
    <!-- 滑杆填充 -->
    <rect x="25" y="370" width="322.5" height="12" fill="#5fd0e020" rx="6"/>
    
    <!-- 滑杆手柄 -->
    <circle cx="347.5" cy="376" r="14" fill="#071119" stroke="#5fd0e0" stroke-width="2" filter="url(#glow)"/>
    <circle cx="347.5" cy="376" r="6" fill="#5fd0e0"/>
    
    <!-- 档位刻度 -->
    <line x1="25" y1="395" x2="25" y2="400" stroke="#6ebdd233" stroke-width="1"/>
    <text x="25" y="410" font-family="Share Tech Mono, monospace" font-size="8" fill="#68838f" text-anchor="middle">0</text>
    
    <line x1="132.5" y1="395" x2="132.5" y2="400" stroke="#6ebdd233" stroke-width="1"/>
    <text x="132.5" y="410" font-family="Share Tech Mono, monospace" font-size="8" fill="#68838f" text-anchor="middle">25</text>
    
    <line x1="240" y1="395" x2="240" y2="400" stroke="#6ebdd233" stroke-width="1"/>
    <text x="240" y="410" font-family="Share Tech Mono, monospace" font-size="8" fill="#68838f" text-anchor="middle">50</text>
    
    <line x1="347.5" y1="395" x2="347.5" y2="400" stroke="#5fd0e0" stroke-width="2"/>
    <text x="347.5" y="410" font-family="Share Tech Mono, monospace" font-size="8" fill="#5fd0e0" text-anchor="middle">75</text>
    
    <line x1="455" y1="395" x2="455" y2="400" stroke="#6ebdd233" stroke-width="1"/>
    <text x="455" y="410" font-family="Share Tech Mono, monospace" font-size="8" fill="#68838f" text-anchor="middle">100</text>
  </g>
  
  <!-- 底部状态栏 -->
  <g id="footer">
    <line x1="10" y1="448" x2="470" y2="448" stroke="#6ebdd222" stroke-width="1"/>
    
    <text x="20" y="465" font-family="Share Tech Mono, monospace" font-size="9" fill="#68838f">
      MOSAICO-S31
    </text>
    
    <text x="240" y="465" font-family="Share Tech Mono, monospace" font-size="9" fill="#5fd0e0" text-anchor="middle">
      [ NEURAL LINK ACTIVE ]
    </text>
    
    <text x="460" y="465" font-family="Share Tech Mono, monospace" font-size="9" fill="#68838f" text-anchor="end">
      2026-09-08
    </text>
  </g>
</svg>
