<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE 风扇控制系统 - 精致版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        #container {
            position: relative;
        }
        
        svg {
            display: block;
            border: 2px solid #5fd0e0;
            border-radius: 4px;
        }
        
        .info-panel {
            position: absolute;
            bottom: -80px;
            left: 0;
            right: 0;
            color: #5fd0e0;
            text-align: center;
            font-size: 14px;
        }
        
        .info-panel p {
            margin: 8px 0;
            color: #68838f;
        }
        
        .info-panel strong {
            color: #5fd0e0;
        }
        
        #restart-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: #5fd0e020;
            border: 1px solid #5fd0e0;
            color: #5fd0e0;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        
        #restart-btn:hover {
            background: #5fd0e040;
            box-shadow: 0 0 10px rgba(95, 208, 224, 0.3);
        }
        
        /* 边框闪烁动画 */
        @keyframes border-flicker {
            0%, 100% { opacity: 0; }
            10% { opacity: 1; }
            20% { opacity: 0.3; }
            30% { opacity: 1; }
            40% { opacity: 0.4; }
            50% { opacity: 1; }
            60%, 100% { opacity: 1; }
        }
        
        /* 内容闪烁动画（延迟启动） */
        @keyframes content-flicker {
            0%, 30% { opacity: 0; }
            40% { opacity: 0.5; }
            50% { opacity: 0.2; }
            60% { opacity: 0.8; }
            70% { opacity: 0.4; }
            80%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="container">
        <svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" id="mainSvg">

                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>

                </filter>
                
                <!-- 强辉光 -->
                <filter id="strongGlow">
                    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>

            </defs>

    <script>
        let bootCompleted = false;
        let temperature = 28.5;
        let rpm = 2450;
        let cpuTemp = 42;
        let currentSpeed = 75;
        let uptime = { h: 0, m: 0, s: 0 };
        let mainLoopInterval = null;
        
        function startBootSequence() {
            const bootSeq = document.getElementById('boot-sequence');
            const mainUI = document.getElementById('main-ui');
            const statusText = document.getElementById('boot-status');
            
            bootSeq.style.opacity = '1';
            mainUI.style.opacity = '0';
            bootCompleted = false;
            
            setTimeout(() => {
                statusText.innerHTML = '<strong>状态:</strong> <span style="color: #5fd0e0;">初始化中...</span>';
                fadeIn('boot-content', 400);
                fadeIn('progress-bg', 400);
                fadeIn('progress-text', 400);
            }, 300);
            
            setTimeout(() => {
                animateProgress(0, 100, 2000, () => {
                    setTimeout(() => {
                        enterMainUI();
                    }, 300);
                });
            }, 800);
        }
        
        function animateProgress(from, to, duration, callback) {
            const startTime = Date.now();
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = from + (to - from) * progress;
                
                progressBar.setAttribute('width', (240 * current / 100).toString());
                progressText.textContent = Math.round(current) + '%';
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else if (callback) {
                    callback();
                }
            }
            update();
        }
        
        function enterMainUI() {
            const bootSeq = document.getElementById('boot-sequence');
            const mainUI = document.getElementById('main-ui');
            const statusText = document.getElementById('boot-status');
            
            fadeOut('boot-sequence', 300, () => {
                bootSeq.style.display = 'none';
            });
            
            mainUI.style.transition = 'opacity 400ms';
            mainUI.style.opacity = '1';
            
            // 分层 CRT 效果 - 逐个模块
            const modules = [
                'header',
                'status-bar',
                'temp-panel',
                'rpm-panel',
                'control-panel',
                'footer'
            ];
            
            modules.forEach((moduleId, index) => {
                setTimeout(() => {
                    layeredCrtPowerUp(moduleId);
                }, index * 300); // 每个模块间隔 300ms
            });
            
            setTimeout(() => {
                bootCompleted = true;
                statusText.innerHTML = '<strong>状态:</strong> <span style="color: #7bc98a;">运行中</span>';
                
                uptime = { h: 0, m: 0, s: 0 };
                
                if (mainLoopInterval) clearInterval(mainLoopInterval);
                mainLoopInterval = setInterval(mainLoop, 1000);
                
                const now = new Date();
                document.getElementById('current-date').textContent = 
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            }, modules.length * 300 + 1200);
        }
        
        // 分层 CRT 上电效果
        function layeredCrtPowerUp(moduleId) {
            const module = document.getElementById(moduleId);
            if (!module) return;
            
            const border = module.querySelector('.module-border');
            const content = module.querySelector('.module-content');
            
            // 先闪烁边框
            if (border) {
                border.style.opacity = '0';
                border.style.animation = 'border-flicker 0.6s ease-out forwards';
            }
            
            // 延迟 300ms 后闪烁内容
            setTimeout(() => {
                if (content) {
                    content.style.opacity = '0';
                    content.style.animation = 'content-flicker 0.8s ease-out forwards';
                }
            }, 300);
            
            // 动画结束后移除，保持稳定
            setTimeout(() => {
                if (border) {
                    border.style.animation = '';
                    border.style.opacity = '1';
                }
                if (content) {
                    content.style.animation = '';
                    content.style.opacity = '1';
                }
            }, 1200);
        }
        
        function fadeIn(id, duration, callback) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.transition = `opacity ${duration}ms`;
            el.style.opacity = '1';
            if (callback) setTimeout(callback, duration);
        }
        
        function fadeOut(id, duration, callback) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.transition = `opacity ${duration}ms`;
            el.style.opacity = '0';
            if (callback) setTimeout(callback, duration);
        }
        
        function mainLoop() {
            if (!bootCompleted) return;
            
            updateUptime();
            updateTemperature();
            updateRpm();
            updateCpuTemp();
        }
        
        function updateUptime() {
            uptime.s++;
            if (uptime.s >= 60) {
                uptime.s = 0;
                uptime.m++;
                if (uptime.m >= 60) {
                    uptime.m = 0;
                    uptime.h++;
                }
            }
            const h = String(uptime.h).padStart(2, '0');
            const m = String(uptime.m).padStart(2, '0');
            const s = String(uptime.s).padStart(2, '0');
            document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
        }
        
        function updateTemperature() {
            temperature += (Math.random() - 0.5) * 0.3;
            temperature = Math.max(25, Math.min(35, temperature));
            document.getElementById('temp-value').textContent = temperature.toFixed(1);
            
            const tempPercent = ((temperature - 20) / 80) * 100;
            const tempBar = document.getElementById('temp-bar');
            if (tempBar) {
                tempBar.setAttribute('width', (190 * tempPercent / 100).toString());
            }
        }
        
        function updateRpm() {
            const targetRpm = currentSpeed * 32 + 100;
            rpm += (targetRpm - rpm) * 0.05;
            rpm = Math.round(rpm);
            document.getElementById('rpm-value').textContent = rpm;
            document.getElementById('rpm-percent').textContent = currentSpeed;
            
            const percent = currentSpeed / 100;
            const circumference = 2 * Math.PI * 28;
            const offset = circumference * (1 - percent);
            const ring = document.getElementById('rpm-ring');
            if (ring) {
                ring.setAttribute('stroke-dashoffset', offset.toString());
            }
            
            const power = (currentSpeed * 8 / 100).toFixed(1);
            document.getElementById('power-value').textContent = power;
        }
        
        function updateCpuTemp() {
            cpuTemp += (Math.random() - 0.5) * 0.5;
            cpuTemp = Math.max(38, Math.min(48, cpuTemp));
            document.getElementById('cpu-temp').textContent = Math.round(cpuTemp);
        }
        
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!bootCompleted) return;
                
                const speed = this.getAttribute('data-speed');
                
                document.querySelectorAll('.speed-btn').forEach(b => {
                    b.classList.remove('active');
                    const polygon = b.querySelector('polygon');
                    const texts = b.querySelectorAll('text');
                    
                    if (b.getAttribute('data-speed') === 'auto') {
                        polygon.setAttribute('fill', '#0a1821');
                        polygon.setAttribute('stroke', '#7bc98a66');
                        polygon.setAttribute('stroke-width', '1.5');
                        polygon.removeAttribute('filter');
                        texts.forEach(t => t.setAttribute('fill', '#7bc98a'));
                    } else {
                        polygon.setAttribute('fill', '#0a1821');
                        polygon.setAttribute('stroke', '#6ebdd266');
                        polygon.setAttribute('stroke-width', '1.5');
                        polygon.removeAttribute('filter');
                        texts.forEach(t => {
                            t.setAttribute('fill', '#68838f');
                            t.setAttribute('font-weight', 'normal');
                        });
                    }
                });
                
                this.classList.add('active');
                const polygon = this.querySelector('polygon');
                const texts = this.querySelectorAll('text');
                
                if (speed === 'auto') {
                    polygon.setAttribute('fill', '#7bc98a20');
                    polygon.setAttribute('stroke', '#7bc98a');
                    polygon.setAttribute('stroke-width', '2');
                    polygon.setAttribute('filter', 'url(#strongGlow)');
                    texts[0].setAttribute('fill', '#7bc98a');
                    texts[0].setAttribute('font-weight', '700');
                    currentSpeed = 60;
                    document.getElementById('current-speed').textContent = '自动模式';
                } else {
                    polygon.setAttribute('fill', '#5fd0e020');
                    polygon.setAttribute('stroke', '#5fd0e0');
                    polygon.setAttribute('stroke-width', '2');
                    polygon.setAttribute('filter', 'url(#strongGlow)');
                    texts[0].setAttribute('fill', '#5fd0e0');
                    texts[0].setAttribute('font-weight', '700');
                    texts[1].setAttribute('fill', '#5fd0e0');
                    currentSpeed = parseInt(speed);
                    document.getElementById('current-speed').textContent = currentSpeed + '%';
                }
            });
        });
        
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (mainLoopInterval) clearInterval(mainLoopInterval);
            
            document.querySelectorAll('.powerup-module').forEach(module => {
                const border = module.querySelector('.module-border');
                const content = module.querySelector('.module-content');
                if (border) {
                    border.style.opacity = '0';
                    border.style.animation = '';
                }
                if (content) {
                    content.style.opacity = '0';
                    content.style.animation = '';
                }
            });
            
            document.getElementById('boot-content').style.opacity = '0';
            document.getElementById('progress-bar').setAttribute('width', '0');
            document.getElementById('boot-sequence').style.display = 'block';
            
            startBootSequence();
        });
        
        window.addEventListener('load', () => {
            startBootSequence();
        });
    </script>
</body>
</html>
