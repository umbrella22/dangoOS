[workspace]
# Device runtime components and the host-side application packaging tool.
members = ["crates/os", "crates/lua-engine", "crates/fs", "tools/app-pack"]
resolver = "2"
exclude = ["vendor/embassy-usb-synopsys-otg", "vendor/esp-wifi-sys-esp32s31", "vendor/esp-radio", "vendor/esp-radio-rtos-driver", "vendor/esp-bluedroid"]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["umbrella22", "Claude", "GLM"]

[workspace.dependencies]
# Published LVGL bindings, used directly by their package names.
# Upgrade both packages together; Cargo.lock records the resolved versions.
rs_lvgl = { version = "0.2.0", default-features = false, features = [
    "alloc",
    "unsafe_no_autoinit",
] }
rs_lvgl_ui = { version = "0.2.0", default-features = false, features = [
    "alloc",
    "no-autoinit",
    # Native hub controls, Lua images/dialogs and the fox/splash canvases.
    "widget-arc",
    "widget-bar",
    "widget-canvas",
    "widget-image",
    "widget-msgbox",
    "widget-slider",
    "widget-spinner",
    "widget-switch",
    "widget-textarea",
    "widget-keyboard",
    "font-montserrat-48",
] }
log = "0.4"
critical-section = "1"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31",
    "unstable",
] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31",
] }
# The PAC esp-hal itself uses, for blocks esp-hal does not drive yet (touch).
esp32s31 = { version = "0.3", features = [
    "critical-section",
], git = "https://github.com/esp-rs/esp-pacs", rev = "5cb8c50" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", default-features = false, features = [
    "esp32s31",
    "log-04",
    "jtag-serial",
    "colors",
] }
# Keep HAL, RTOS, PHY, radio and ROM bindings on one reviewed revision.
# Mixing registry and git variants can link two incompatible esp_rom_sys crates.
esp-rtos = { version = "0.4.0", git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31",
    "embassy",
    "esp-radio",
    "log-04",
] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = [
    "esp32s31", "wifi", "ble", "coex", "unstable", "log-04",
] }
embassy-executor = "0.10"
embassy-time = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1


[patch.crates-io]
# Preserve the actual 0.4.0 source and local reconnect patches; terminate stale IN transfers on reset.
embassy-usb-synopsys-otg = { path = "vendor/embassy-usb-synopsys-otg" }

[patch."https://github.com/esp-rs/esp-wifi-sys.git"]
# Pinned S31 blobs/bindings; build-only formatter namespace for Lua/newlib.
esp-wifi-sys-esp32s31 = { path = "vendor/esp-wifi-sys-esp32s31" }

[patch."https://github.com/esp-rs/esp-hal"]
# S31 controller linked-list buffers require internal RAM even with a PSRAM heap.
esp-radio = { path = "vendor/esp-radio" }
# Keep native radio tasks, including the shared timer worker, on Core0.
esp-radio-rtos-driver = { path = "vendor/esp-radio-rtos-driver" }
