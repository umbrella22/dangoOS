[package]
name = "eve-fan-control"
version = "0.2.0"
edition = "2021"
authors = ["Kiro", "Claude"]

# ============================================
# 硬件变体选择 (Features)
# ============================================
# 使用方法:
#   桌面开发: cargo run
#   ESP32-S31 Mosaico: cargo build --features mosaico
#   ESP32-S31 Korvo-1: cargo build --features korvo

[features]
default = []  # 桌面开发模式（无硬件 feature）

# ESP32-S31 硬件变体
mosaico = []  # ESP-Mosaico 官方开发板 (480×480 AMOLED)
korvo = []    # ESP32-S31-Korvo-1 开发板 (800×480 RGB LCD)

[dependencies]
slint = "1.3"
rand = "0.8"

# TODO: 真机硬件依赖（取消注释）
# esp-idf-hal = "0.42"
# esp-idf-sys = "0.33"
# embedded-hal = "0.2"

[build-dependencies]
slint-build = "1.3"

[[bin]]
name = "fan-control"
path = "src/main.rs"
