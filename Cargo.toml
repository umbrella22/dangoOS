[workspace]
# grok-ball is the shared host-testable core; mosaico-s31 is the ESP32-S31
# firmware and host preview crate. The pre-grok-ball prototype is archived
# under archive/crates-pre-grok-ball-20261020/ (not a member).
members = ["crates/grok-ball", "crates/mosaico-s31"]
default-members = ["crates/grok-ball"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Kiro", "Claude", "GLM"]

[workspace.dependencies]
# Sibling checkout; the tested revision is pinned in lvgl.rev
# (scripts/check-lvgl-pin.sh).
lvgl = { path = "../lv_binding_rust/lvgl", default-features = false, features = ["alloc", "unsafe_no_autoinit"] }
lvgl-ui = { path = "../lv_binding_rust/lvgl-ui", default-features = false, features = ["alloc", "no-autoinit"] }
log = "0.4"
critical-section = "1"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31", "unstable"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31"] }
esp-backtrace = { version = "0.20", features = ["esp32s31", "panic-handler", "println", "custom-halt"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32s31", "log-04", "jtag-serial", "colors"] }
# esp-rtos 0.4.0 from the pinned esp-hal revision. Taking it from the esp-hal
# repository (rather than crates.io) keeps esp-hal and esp-rom-sys at the exact
# same revision: the registry esp-rtos links a second esp-rom-sys, which Cargo
# rejects because both packages declare `links = "esp_rom_sys"`.
esp-rtos = { version = "0.4.0", git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31", "embassy", "log-04"] }
embassy-executor = "0.10"
embassy-time = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1


