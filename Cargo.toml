[workspace]
# One crate: the ESP32-S31 firmware (bin) plus its host-testable library.
# The earlier vector "grok-ball" core is in git history (before the fox).
members = ["crates/mosaico-s31", "crates/mosaico-lua", "crates/mosaico-fs"]
resolver = "2"
exclude = ["vendor/embassy-usb-synopsys-otg"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Kiro", "Claude", "GLM"]

[workspace.dependencies]
# LVGL bindings: pinned Git revision of https://github.com/umbrella22/lvgl_binding_rust
# (Cargo.lock records it too; bump `rev` in both lines together).
lvgl = { git = "https://github.com/umbrella22/lvgl_binding_rust", rev = "cad031112d4d176a415e8029d9bc3963da364381", default-features = false, features = ["alloc", "unsafe_no_autoinit"] }
lvgl-ui = { git = "https://github.com/umbrella22/lvgl_binding_rust", rev = "cad031112d4d176a415e8029d9bc3963da364381", default-features = false, features = ["alloc", "no-autoinit"] }
log = "0.4"
critical-section = "1"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31", "unstable"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31"] }
# The PAC esp-hal itself uses, for blocks esp-hal does not drive yet (touch).
esp32s31 = { version = "0.2", features = ["critical-section"], git = "https://github.com/esp-rs/esp-pacs", rev = "5cd68d2" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32s31", "log-04", "jtag-serial", "colors"] }
# esp-rtos 0.4.0 from the pinned esp-hal revision. Taking it from the esp-hal
# repository (rather than crates.io) keeps esp-hal and esp-rom-sys at the exact
# same revision: the registry esp-rtos links a second esp-rom-sys, which Cargo
# rejects because both packages declare `links = "esp_rom_sys"`.
esp-rtos = { version = "0.4.0", git = "https://github.com/esp-rs/esp-hal", rev = "bb239a0f4adc45b2571586c3ea55f56ecc712e00", features = ["esp32s31", "embassy", "log-04"] }
embassy-executor = "0.10"
embassy-time = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1



[patch.crates-io]
# Preserve the actual 0.4.0 source and local reconnect patches; terminate stale IN transfers on reset.
embassy-usb-synopsys-otg = { path = "vendor/embassy-usb-synopsys-otg" }
