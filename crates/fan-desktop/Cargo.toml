[package]
name = "fan-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Desktop fan control simulator"
default-run = "fan-control"

[dependencies]
fan-core.workspace = true
fan-ui = { workspace = true, features = ["std"] }
slint = { workspace = true, features = ["default"] }
rand.workspace = true

[[bin]]
name = "fan-control"
path = "src/main.rs"
