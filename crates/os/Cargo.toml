[package]
name = "os"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ESP-Mosaico S31 firmware: the fox-dango companion (host-testable lib + device bin)"
publish = false

[lib]
name = "os"
path = "src/lib.rs"

[features]
default = ["dual-core-ui", "lua-engine"]
lua-engine = ["dep:lua-engine"]
ts-engine = ["dep:ts-engine", "app-host/serde", "app-host/graphics"]
# Device binary only; integration tests build the host library.
firmware = []
# RGB888 native controls and BGR888 panel input; RGB565 remains available for A/B.
display-rgb888 = ["board-s31/display-rgb888"]
display-metrics = ["board-s31/display-metrics"]
# A/B experiment: native updates covering at most half the panel bypass TE.
display-low-latency = []
# Native LVGL memory-panel simulator, without device HAL or peripherals.
display-simulator = []
# Core1 UI/app executor. Single-core builds explicitly select one engine with no defaults.
dual-core-ui = []
# Opt-in native UI diagnostics, strict properties and update metrics.
ui-validation = ["rs_lvgl_ui/diagnostics", "rs_lvgl_ui/strict-properties", "rs_lvgl_ui/update-metrics"]
# Independent binary CDC, UI-thread Agent and final-plane capture.
embedscope = ["dep:escope-protocol", "dep:escope-agent", "dep:escope-lvgl", "rs_lvgl_ui/diagnostics"]

[[test]]
name = "ui_reliability"
required-features = ["ui-validation"]

[[example]]
name = "screenshots"
required-features = ["lua-engine"]

[[example]]
name = "display_pipeline"
required-features = ["display-simulator"]

[dependencies]
board-s31 = { path = "../board-s31" }
boot-contract = { path = "../boot-contract" }
voice-session = { path = "../voice-session" }
escope-protocol = { version = "0.2.0", optional = true }
escope-agent = { version = "0.2.0", optional = true }
# The application TreeSource reads the rs_lvgl provider used by the shell.
escope-lvgl = { version = "0.2.0", optional = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = { version = "0.10", default-features = false }
# RFC 6455 upgrade digest and PCM transport encoding (no_std).
sha1 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
md-5 = { version = "0.10", default-features = false }
log.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
embedded-io = { version = "0.7", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
critical-section.workspace = true
# Host-buildable UI dependencies: the library and integration tests build
# with the plain host toolchain; the ESP HAL/RTOS dependencies stay target
# gated.
rs_lvgl.workspace = true
rs_lvgl_ui.workspace = true
app-host = { path = "../app-host" }
lua-engine = { path = "../lua-engine", optional = true }
ts-engine = { workspace = true, optional = true }
fs = { path = "../fs" }

[build-dependencies]
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal.workspace = true
esp32s31.workspace = true
esp-alloc.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-storage.workspace = true
esp-println.workspace = true
esp-rtos = { workspace = true, features = ["rtos-trace"] }
esp-sync = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = ["esp32s31"] }
rtos-trace = "0.2.1"
esp-radio.workspace = true
esp-bluedroid = { path = "../../vendor/esp-bluedroid" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6", features = ["default-core0"] }
static_cell = "2.1"
embassy-net = { version = "0.8", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }
rustls = { version = "0.23.45", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "234c8dd12469a849945400698c8e48210f3556c9", default-features = false, features = ["alloc", "tls12", "zeroize"] }
webpki-roots = { version = "1", default-features = false }
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-usb = { version = "0.6", default-features = false }
embassy-futures = "0.1"
embassy-sync = "0.8"

[dev-dependencies]
# Exercise the production owned TLS engine against an in-memory TLS server.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "234c8dd12469a849945400698c8e48210f3556c9", default-features = false, features = ["alloc", "tls12", "zeroize"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
lua-engine = { path = "../lua-engine" }
rlsf = { version = "0.2", features = ["unstable"] }
# Exercise the firmware runner with real DHCP and a manually advanced clock.
embassy-net = { version = "0.8", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-8"] }
embassy-sync = "0.8"
critical-section = { workspace = true, features = ["std"] }

[[bin]]
name = "os-fw"
required-features = ["firmware"]
path = "src/main.rs"
test = false
bench = false
