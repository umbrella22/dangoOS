[package]
name = "mosaico-s31"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ESP-Mosaico S31 firmware: the fox-dango companion (host-testable lib + device bin)"
publish = false

[lib]
name = "mosaico_s31"
path = "src/lib.rs"

[features]
default = []
# Fault injection only for RTC-armed, unconfirmed A/B candidates.
ota-test-panic = []
# Read-only motor/RMT receipts for manual hardware diagnosis; no waveform changes.
haptic-diagnostics = []
# Read-only per-sample touch/edge receipts, capped per port activation.
touch-key-diagnostics = []
# Bounded touch-to-plane phase receipts; timing and behavior remain unchanged.
touch-latency-diagnostics = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
log.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Host-buildable UI dependencies: the library and the host previews build
# with the plain host toolchain; the ESP HAL/RTOS dependencies stay target
# gated.
lvgl.workspace = true
lvgl-ui.workspace = true
mosaico-lua = { path = "../mosaico-lua" }
mosaico-fs = { path = "../mosaico-fs" }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal.workspace = true
esp32s31.workspace = true
esp-alloc.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-storage.workspace = true
esp-println.workspace = true
esp-rtos.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-usb = { version = "0.6", default-features = false }
embassy-futures = "0.1"
embassy-sync = "0.8"
critical-section.workspace = true

[[bin]]
name = "mosaico-s31-fw"
path = "src/main.rs"
test = false
bench = false
