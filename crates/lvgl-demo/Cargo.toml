[package]
name = "lvgl-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "LVGL 9.6 official widgets demo firmware for ESP-Mosaico (v1.2)"

[dependencies]
esp-hal.workspace = true
esp-alloc.workspace = true
esp-backtrace.workspace = true
esp-println.workspace = true
esp-bootloader-esp-idf.workspace = true
critical-section.workspace = true
log.workspace = true
cstr_core = { version = "0.2.6", default-features = false, features = ["alloc"] }
# LVGL 9.6 Rust bindings (vendored LVGL 9.6.0 C sources, compiled by
# lvgl-sys's cc build for riscv32imafc). See ../../.cargo/config.toml [env]
# for the cross toolchain wiring.
lvgl = { path = "../../../lv_binding_rust/lvgl", default-features = false, features = [
    # No ctor-based auto init on the MCU: we call lvgl::init() explicitly.
    "unsafe_no_autoinit",
    # lvgl::timer::update_clock registers lv_tick_set_cb (LVGL 9 tick source).
    "rust_timer",
    # Compile the vendored official widgets demo and expose lv_demo_widgets().
    "demo-widgets",
] }

[[bin]]
name = "lvgl-demo-fw"
path = "src/main.rs"
test = false
bench = false
