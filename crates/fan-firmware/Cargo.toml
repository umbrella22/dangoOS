[package]
name = "fan-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Bare-metal ESP-Mosaico (v1.2) firmware"
default-run = "fan-control-fw"

[features]
# Show raw RGB565 colors and pixel edges for 15 seconds before starting Slint.
lcd-color-test = []
# Opt in only when GPIO12 is reserved for a fan and the left slot is empty.
# No module arbitration is implemented; this never enables PWM automatically.
fan-pwm-gpio12 = []

[dependencies]
i-slint-renderer-software = { version = "=1.17.1", default-features = false, features = ["render-profiling"] }
fan-core.workspace = true
fan-ui = { workspace = true, features = ["embedded"] }
esp-hal.workspace = true
esp32s31.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-alloc.workspace = true
esp-backtrace.workspace = true
esp-println.workspace = true
critical-section.workspace = true
log.workspace = true
libm.workspace = true
slint = { workspace = true, features = [
    "unsafe-single-threaded", "renderer-software", "software-renderer-path", "libm",
] }

[[bin]]
name = "fan-control-fw"
path = "src/main.rs"
test = false
bench = false
