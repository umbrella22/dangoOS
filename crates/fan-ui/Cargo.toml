[package]
name = "fan-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared Slint layouts and embedded fonts"

[features]
default = ["std"]
std = ["slint/std"]
software-rendering = ["slint/renderer-software", "slint/software-renderer-path"]
embedded = ["slint/unsafe-single-threaded", "slint/libm", "software-rendering"]

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[[test]]
name = "software_rendering"
required-features = ["std", "software-rendering"]

[[test]]
name = "mosaic_rendering"
required-features = ["std", "embedded"]

[[test]]
name = "mosaic_visuals"
required-features = ["std", "embedded"]
